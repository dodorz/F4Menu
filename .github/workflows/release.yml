name: Build and Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Write version.h from tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          MAJOR=$(echo "$TAG" | cut -d. -f1)
          MINOR=$(echo "$TAG" | cut -d. -f2)
          PATCH=$(echo "$TAG" | cut -d. -f3)
          BUILD=$(echo "$TAG" | grep -oP '(?<=-)\d+$' || echo "0")
          cat > version.h << EOF
          #ifndef F4MENU_VERSION_H
          #define F4MENU_VERSION_H
          #define F4MENU_VERSION_A L"$TAG"
          #define F4MENU_VER_MAJOR $MAJOR
          #define F4MENU_VER_MINOR $MINOR
          #define F4MENU_VER_PATCH $PATCH
          #define F4MENU_VER_BUILD $BUILD
          #endif
          EOF

      - name: Build and collect per-platform binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($arch in @('x64', 'Win32', 'ARM64')) {
            Write-Host "=== Building $arch ==="
            msbuild F4Menu.vcxproj /t:Rebuild /p:Configuration=Release /p:Platform=$arch /p:SolutionDir="$PWD\" /v:minimal /nologo
            if ($LASTEXITCODE -ne 0) { exit 1 }
            New-Item -ItemType Directory -Path "dist\$arch" -Force | Out-Null
            Copy-Item F4Menu.exe "dist\$arch\F4Menu.exe" -Force
            Copy-Item F4Menu.ini "dist\$arch\F4Menu.ini" -Force
          }

      - name: Package
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          7z a "F4Menu-${TAG}-x64.zip"    ./dist/x64/*
          7z a "F4Menu-${TAG}-Win32.zip"  ./dist/Win32/*
          7z a "F4Menu-${TAG}-ARM64.zip"  ./dist/ARM64/*

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ github.ref_name }}
          files: |
            F4Menu-${{ github.ref_name }}-x64.zip
            F4Menu-${{ github.ref_name }}-Win32.zip
            F4Menu-${{ github.ref_name }}-ARM64.zip
          generate_release_notes: true
