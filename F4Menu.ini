; F4Menu 配置文件
; 每个段就是一个程序：段名是显示名称，段在文件里的先后顺序就是列表顺序
; 只有带 Path 的段会被读取；[General] 存放默认值，其余的段、注释和空行都会原样保留
;   Path   可执行文件路径，支持 %ENV% 环境变量
;   Param  启动参数，%1 代表文件路径
;   Start  起始目录
;   Icon   图标，格式为 图标文件,图标序号
;   Type   匹配的文件扩展名，逗号分隔，如 txt,log,md
;   Mode   separate = 每个文件单独启动，merge = 多个文件交给同一个实例（默认 separate）
;   Window normal = 常规，max = 最大化，min = 最小化（默认 normal）
; Mode / Window 与默认值相同的段不写这两行，改 DefaultMode / DefaultWindow 会一起生效

[General]
DefaultMode=separate
DefaultWindow=normal

[Notepad]
Path=%USERPROFILE%\Tools\Notepad3.exe
Icon=%USERPROFILE%\Tools\Notepad3.exe,0
Type=txt,ini,conf,cfg,properties,bat,cmd,md,markdown,html,htm,shtml,xhtml,css,xml,xsd,xsl,xslt,dtd,c,h,cpp,cxx,cc,hpp,hh,hxx,java,cs,js,cs,lua,lsp,pl,php,py,pyw,pm,rb,rbw,rhtml,lua,wlua,sh,tcl,tex,for,reb,asm,asp,jsp,vbs,vb,bas,json,ps1,ahk,au2,au3,nsi,inf,reg,sql,asc,log,text,manifest,url,*

